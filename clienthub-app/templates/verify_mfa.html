{% extends "base.html" %}{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow p-7">
<h1 class="text-2xl font-bold mb-3">Two-factor authentication</h1>
<p class="mb-4 text-slate-600">Enter the current six-digit code from your authenticator app.</p>
<form method="post" class="space-y-4">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input class="w-full border rounded p-2" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
<button class="bg-blue-700 text-white rounded px-4 py-2">Verify</button>
</form></div>{% endblock %}
