{% extends "base.html" %}{% block content %}
<div class="flex justify-between items-center mb-5"><h1 class="text-3xl font-bold">Document requests</h1>{% if current_user.role == 'admin' %}<a class="bg-blue-700 text-white rounded px-4 py-2" href="{{ url_for('request_new') }}">Create request</a>{% endif %}</div>
<div class="bg-white rounded-xl shadow p-5">{% for item in requests_list %}<div class="border-b py-3"><a class="text-blue-700 underline font-semibold" href="{{ url_for('request_detail', request_id=item.id) }}">{{ item.title }}</a> — {{ item.customer.company }} — {{ item.status }}</div>{% else %}<p>No requests found.</p>{% endfor %}</div>{% endblock %}
