{% extends "base.html" %}{% block content %}
<div class="flex justify-between items-center mb-5"><h1 class="text-3xl font-bold">Customer accounts</h1><a class="bg-blue-700 text-white rounded px-4 py-2" href="{{ url_for('customer_new') }}">New customer</a></div>
<div class="bg-white rounded-xl shadow p-5"><table class="w-full text-left"><thead><tr><th class="p-2">Name</th><th class="p-2">Company</th><th class="p-2">Email</th><th class="p-2">Action</th></tr></thead><tbody>
{% for customer in customers %}<tr class="border-t"><td class="p-2">{{ customer.name }}</td><td class="p-2">{{ customer.company }}</td><td class="p-2">{{ customer.email }}</td><td class="p-2"><a class="text-blue-700 underline" href="{{ url_for('customer_edit', customer_id=customer.id) }}">Edit</a></td></tr>{% else %}<tr><td colspan="4" class="p-2">No customer accounts.</td></tr>{% endfor %}
</tbody></table></div>{% endblock %}
