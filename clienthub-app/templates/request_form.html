{% extends "base.html" %}{% block content %}
<h1 class="text-3xl font-bold mb-5">Create document request</h1>
<form method="post" class="bg-white rounded-xl shadow p-6 max-w-xl space-y-4">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="block">Customer<select class="w-full border rounded p-2 mt-1" name="customer_id" required><option value="">Choose customer</option>{% for customer in customers %}<option value="{{ customer.id }}">{{ customer.company }} ({{ customer.email }})</option>{% endfor %}</select></label>
<label class="block">Title<input class="w-full border rounded p-2 mt-1" name="title" required></label>
<label class="block">Description<textarea class="w-full border rounded p-2 mt-1" name="description" rows="4"></textarea></label>
<button class="bg-blue-700 text-white rounded px-4 py-2">Create request</button></form>{% endblock %}
